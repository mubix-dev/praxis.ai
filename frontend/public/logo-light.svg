<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64">
  <defs>
    <linearGradient id="pxll-glow" x1="-10" y1="6" x2="10" y2="-4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pxll-rim" x1="-19" y1="17" x2="19" y2="-15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pxll-ai" x1="90" y1="44" x2="165" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- the Praxis agent, visor style (for light backgrounds) -->
  <g transform="translate(26 31) scale(0.72)">
    <line x1="0" y1="-15" x2="0" y2="-21" stroke="#4338ca" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="-23.5" r="2.8" fill="#0891b2"/>
    <rect x="-19" y="-15" width="38" height="32" rx="12" fill="#1e2430" stroke="url(#pxll-rim)" stroke-width="1.6"/>
    <rect x="-11" y="-6" width="7" height="10" rx="3.5" fill="url(#pxll-glow)"/>
    <rect x="4" y="-6" width="7" height="10" rx="3.5" fill="url(#pxll-glow)"/>
    <path d="M-4 10 Q0 13 4 10" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- wordmark (dark text for light theme) — the A and I carry the gradient -->
  <text x="54" y="40" font-family="'Avenir Next', 'Century Gothic', 'Futura', 'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="500" letter-spacing="3.5" fill="#0f172a">PR<tspan fill="url(#pxll-ai)">A</tspan>X<tspan fill="url(#pxll-ai)">I</tspan>S</text>
</svg>
