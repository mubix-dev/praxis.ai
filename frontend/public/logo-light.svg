<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64">
  <defs>
    <radialGradient id="pxll-core" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="55%" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
    <linearGradient id="pxll-ring" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pxll-ai" x1="100" y1="44" x2="160" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="pxll-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- mark: agents in orbit around a glowing core -->
  <g filter="url(#pxll-glow)">
    <g fill="none">
      <g>
        <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#pxll-ring)" stroke-width="2" transform="rotate(-30 32 32)"/>
        <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="#0891b2" stroke-width="1.6" transform="rotate(30 32 32)" opacity="0.75"/>
        <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="#6d5efc" stroke-width="1.4" transform="rotate(90 32 32)" opacity="0.55"/>
        <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="24s" repeatCount="indefinite"/>
      </g>

      <g>
        <circle cx="13" cy="43" r="2.4" fill="#0891b2"/>
        <circle cx="51" cy="43" r="2.4" fill="#059669"/>
        <circle cx="32" cy="10" r="2.4" fill="#db2777"/>
        <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="24s" repeatCount="indefinite"/>
      </g>
    </g>

    <circle cx="32" cy="32" r="7" fill="url(#pxll-core)">
      <animate attributeName="r" values="7;7.8;7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark (dark text for light theme) — the A and I carry the gradient -->
  <text x="66" y="40" font-family="'Avenir Next', 'Century Gothic', 'Futura', 'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="500" letter-spacing="3.5" fill="#0f172a">PR<tspan fill="url(#pxll-ai)">A</tspan>X<tspan fill="url(#pxll-ai)">I</tspan>S</text>
</svg>
