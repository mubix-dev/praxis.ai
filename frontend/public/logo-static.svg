<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64">
  <defs>
    <radialGradient id="pxs-core" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="55%" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
    <linearGradient id="pxs-ring" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pxs-ai" x1="110" y1="44" x2="175" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- mark: static orbits + core (no animation, no blur filter) -->
  <g fill="none">
    <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#pxs-ring)" stroke-width="2" transform="rotate(-30 32 32)" opacity="0.9"/>
    <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="#06b6d4" stroke-width="1.6" transform="rotate(30 32 32)" opacity="0.65"/>
    <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="#6d5efc" stroke-width="1.4" transform="rotate(90 32 32)" opacity="0.45"/>
  </g>
  <circle cx="13" cy="43" r="2.4" fill="#06b6d4"/>
  <circle cx="51" cy="43" r="2.4" fill="#10b981"/>
  <circle cx="32" cy="10" r="2.4" fill="#ec4899"/>
  <circle cx="32" cy="32" r="7" fill="url(#pxs-core)"/>

  <!-- wordmark -->
  <text x="66" y="40" font-family="'Avenir Next', 'Century Gothic', 'Futura', 'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="500" letter-spacing="3.5" fill="#e8ecf4">PR<tspan fill="url(#pxs-ai)">A</tspan>X<tspan fill="url(#pxs-ai)">I</tspan>S</text>
</svg>
