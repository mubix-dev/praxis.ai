<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="px-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1b1440"/>
      <stop offset="1" stop-color="#06070c"/>
    </radialGradient>
    <radialGradient id="px-core" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="55%" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
    <linearGradient id="px-ring" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="px-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#px-bg)"/>

  <g filter="url(#px-glow)">
    <!-- three orbits, two agents each -->
    <g fill="none">
      <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#px-ring)" stroke-width="1.8" transform="rotate(-30 32 32)" opacity="0.85"/>
      <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="#06b6d4" stroke-width="1.5" transform="rotate(30 32 32)" opacity="0.6"/>
      <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="#6d5efc" stroke-width="1.3" transform="rotate(90 32 32)" opacity="0.45"/>
    </g>

    <!-- six agents: coding, chat, search, vision, pdf, ppt -->
    <circle cx="32" cy="10" r="2.2" fill="#6d5efc"/>
    <circle cx="51" cy="21" r="2.2" fill="#06b6d4"/>
    <circle cx="51" cy="43" r="2.2" fill="#10b981"/>
    <circle cx="32" cy="54" r="2.2" fill="#eab308"/>
    <circle cx="13" cy="43" r="2.2" fill="#f97316"/>
    <circle cx="13" cy="21" r="2.2" fill="#ec4899"/>

    <!-- the router: one core binding them -->
    <circle cx="32" cy="32" r="7" fill="url(#px-core)"/>
  </g>
</svg>
